<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DmFirst</title>
    <script type="text/javascript">
      // Check for direct section links like /admin and /login
      var p = window.location.pathname;
      if (p.includes('/admin')) {
        window.location.replace('/dmfirst/admin/');
      } else if (p.includes('/login')) {
        window.location.replace('/dmfirst/login/');
      } else {
        // Single Page App redirect for GitHub Pages
        var pathSegmentsToKeep = 1; // /dmfirst/
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body></body>
</html>
