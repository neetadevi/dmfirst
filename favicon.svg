<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2533"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d48806"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#694500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="url(#shieldBorder)" stroke-width="3" opacity="0.8"/>

  <!-- Crown Icon on Top -->
  <path d="M60 74 L74 96 L96 66 L118 96 L132 74 L126 108 L66 108 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Jewels on crown -->
  <circle cx="60" cy="72" r="4" fill="#ffffff"/>
  <circle cx="96" cy="64" r="5" fill="#ffffff"/>
  <circle cx="132" cy="72" r="4" fill="#ffffff"/>
  <circle cx="96" cy="94" r="3.5" fill="#e1251b"/>

  <!-- Text: RAI -->
  <text x="96" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">RAI</text>
  
  <!-- Badge: 08 -->
  <rect x="74" y="152" width="44" height="20" rx="10" fill="#f5a623"/>
  <text x="96" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">08</text>
</svg>
